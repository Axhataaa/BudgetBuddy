name: Scheduled Monthly Report Notifications

on:
  schedule:
    - cron: "0 4 1 * *" # 04:00 UTC on the 1st of every month
  workflow_dispatch: {} # allows manual runs from the Actions tab for testing

jobs:
  trigger-monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Call run-scheduled endpoint (job=monthly)
        env:
          SCHEDULED_TASK_SECRET: ${{ secrets.SCHEDULED_TASK_SECRET }}
          RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
        run: |
          curl -f --max-time 120 \
            -X POST \
            -H "X-Scheduled-Task-Secret: ${SCHEDULED_TASK_SECRET}" \
            "${RENDER_BACKEND_URL}/api/v1/notifications/run-scheduled/?job=monthly"
